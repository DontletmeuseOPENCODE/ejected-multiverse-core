modLoader="neoforge"
loaderVersion="${neo_version_range}"
license="MIT"

[[mods]]
modId="ejectedmultiverse"
version="${mod_version}"
displayName="(Ejected) Multiverse Core v.6.6.6"
authors="DontletmeuseOPENCODE"
description='''
Liminal / uncanny horror mod. Multi-dimension core for the Ejected Multiverse.

Phase 1: project skeleton. No content yet — only the mod entrypoint loads.
Phase 2: dimension registry, portal block, sanity capability.
See PLANS.md for the full roadmap.
'''
displayURL="https://github.com/DontletmeuseOPENCODE/ejected-multiverse-core"
# logoFile="assets/ejectedmultiverse/icon.png"  ← dodamy w Fazie 7 (asset pass)

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
