# ─────────────────────────────────────────────────────────────────────
#  Ejected Multiverse — gradle.properties
#  JVM, Gradle daemon, kodowanie, ustawienia moda
# ─────────────────────────────────────────────────────────────────────

# JVM: 4G sterty wystarczy na 1.21 + NeoGradle, w razie OOM podnieś
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8

# Gradle daemon i cache: przyspieszamy iteracyjne buildy
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true

# Kodowanie źródeł w Gradle (workaround dla Windows)
org.gradle.console=plain

# Wersja modowa (lustrzana z build.gradle.kts)
mod_version=0.1.0-alpha
mod_id=ejectedmultiverse
mod_name=(Ejected) Multiverse Core v.6.6.6
mod_license=MIT
mod_authors=DontletmeuseOPENCODE
mod_description=Liminal / uncanny horror mod. Multi-dimension core for the Ejected Multiverse.

# Java toolchain
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
